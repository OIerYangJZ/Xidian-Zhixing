<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><script src="icons2.js"></script></helmet>
<article style="position:relative;display:flex;gap:13px;padding:16px 18px 10px;background:var(--surface);color:var(--text);border:{{ bd }};border-radius:{{ rd }};box-shadow:{{ sh }};box-sizing:border-box;width:100%;text-align:left;transition:background .2s,box-shadow .2s,transform .2s" style-hover="background:color-mix(in oklab,var(--primary) 3%,var(--surface))">
  <div style="flex:none;display:flex;flex-direction:column;align-items:center;gap:8px">
    <sc-if value="{{ p.anon }}" hint-placeholder-val="{{ false }}">
      <div style="width:40px;height:40px;border-radius:6px;background:var(--seal);color:var(--on-primary);display:grid;place-items:center;font:600 19px/1 var(--serif);box-shadow:inset 0 0 0 2.5px var(--seal),inset 0 0 0 3.5px color-mix(in oklab,var(--on-primary) 60%,transparent),0 2px 6px var(--primary-glow)">{{ p.initial }}</div>
    </sc-if>
    <sc-if value="{{ real }}" hint-placeholder-val="{{ true }}">
      <div style="position:relative;width:40px;height:40px;border-radius:50%;background:{{ avBg }};color:{{ avFg }};display:grid;place-items:center;font-size:15px;font-weight:650;box-shadow:{{ avRing }}">{{ p.initial }}<sc-if value="{{ followDot }}"><span style="position:absolute;right:-3px;bottom:-3px;width:18px;height:18px;box-sizing:border-box;border-radius:50%;background:var(--primary);color:var(--on-primary);border:2px solid var(--surface);display:grid;place-items:center;font-size:11px">{{ I.plus }}</span></sc-if></div>
    </sc-if>
    <sc-if value="{{ isThreads }}"><div style="flex:1;width:2px;min-height:16px;border-radius:1px;background:linear-gradient(var(--line-strong),transparent)"></div></sc-if>
  </div>
  <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:8px">
    <div style="display:flex;align-items:center;gap:8px;min-height:22px">
      <div style="flex:1;min-width:0;display:flex;align-items:baseline;gap:6px;flex-wrap:wrap">
        <span style="font-size:14px;font-weight:650;color:var(--text)">{{ p.name }}</span>
        <span style="font-size:12px;color:var(--text-3)">· {{ time }}</span>
      </div>
      <button title="更多" style="flex:none;width:36px;height:32px;margin:-6px -10px -6px 0;border:0;background:transparent;color:var(--text-3);border-radius:10px;display:grid;place-items:center;font-size:18px;cursor:pointer;transition:background .15s" style-hover="background:var(--bg-sunk);color:var(--text)">{{ I.more }}</button>
    </div>
    <sc-if value="{{ hasBadges }}">
      <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:-2px">
        <sc-for list="{{ badges }}" as="b" hint-placeholder-count="2">
          <span style="display:inline-flex;align-items:center;gap:4px;height:21px;padding:0 8px;border-radius:6px;font-size:11px;font-weight:600;line-height:1;white-space:nowrap;color:{{ b.fg }};background:{{ b.bg }};box-shadow:{{ b.bd }}"><sc-if value="{{ b.dot }}"><span style="width:6px;height:6px;border-radius:50%;background:{{ b.dot }};box-shadow:{{ b.ring }}"></span></sc-if><sc-if value="{{ b.icon }}"><span style="display:flex;font-size:12px;--duo:.35">{{ b.icon }}</span></sc-if>{{ b.t }}</span>
        </sc-for>
      </div>
    </sc-if>
    <sc-if value="{{ p.title }}"><h3 style="margin:0;font-size:17px;line-height:25px;font-weight:650;letter-spacing:-.005em;color:var(--text);text-wrap:pretty;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden">{{ p.title }}</h3></sc-if>
    <p style="margin:0;font-size:15px;line-height:23px;color:var(--text-2);text-wrap:pretty;display:-webkit-box;-webkit-line-clamp:{{ clamp }};-webkit-box-orient:vertical;overflow:hidden"><sc-for list="{{ segs }}" as="s"><sc-if value="{{ s.tag }}"><span style="color:var(--primary);font-weight:550">{{ s.t }}</span></sc-if><sc-if value="{{ s.plain }}"><span>{{ s.t }}</span></sc-if></sc-for></p>
    <sc-if value="{{ hasImgs }}">
      <div style="display:grid;grid-template-columns:{{ imgCols }};gap:4px;border-radius:14px;overflow:hidden;max-width:520px">
        <sc-for list="{{ imgs }}" as="im">
          <div style="position:relative;aspect-ratio:{{ imgRatio }};background:repeating-linear-gradient(135deg,var(--bg-sunk) 0 8px,color-mix(in oklab,var(--bg-sunk) 45%,var(--surface)) 8px 16px);display:grid;place-items:center">
            <span style="font:500 10px/1 var(--mono);color:var(--text-3);letter-spacing:.05em;padding:4px 7px;border-radius:5px;background:var(--glass)">{{ im.label }}</span>
            <sc-if value="{{ im.more }}"><div style="position:absolute;inset:0;background:var(--scrim);backdrop-filter:blur(2px);color:var(--on-scrim);display:grid;place-items:center;font-size:20px;font-weight:650">{{ im.more }}</div></sc-if>
          </div>
        </sc-for>
      </div>
    </sc-if>
    <div style="display:flex;align-items:center;gap:4px;margin:0 0 0 -8px;color:var(--text-2)">
      <button style="display:flex;align-items:center;gap:6px;height:32px;padding:0 11px 0 8px;border:0;border-radius:16px;background:{{ likeBg }};font:inherit;font-size:13px;font-weight:550;color:{{ likeColor }};cursor:pointer;transition:background .15s" style-hover="background:var(--primary-soft);color:var(--primary)"><span style="display:flex;font-size:18px">{{ likeIcon }}</span>{{ p.likes }}</button>
      <button style="display:flex;align-items:center;gap:6px;height:32px;padding:0 11px 0 8px;border:0;border-radius:16px;background:transparent;font:inherit;font-size:13px;font-weight:550;color:var(--text-2);cursor:pointer;transition:background .15s" style-hover="background:var(--bg-sunk)"><span style="display:flex;font-size:18px">{{ I.comment }}</span>{{ p.comments }}</button>
      <button style="display:flex;align-items:center;gap:6px;height:32px;padding:0 11px 0 8px;border:0;border-radius:16px;background:{{ favBg }};font:inherit;font-size:13px;font-weight:550;color:{{ favColor }};cursor:pointer;transition:background .15s" style-hover="background:var(--accent-soft);color:var(--accent-ink)"><span style="display:flex;font-size:18px">{{ favIcon }}</span>{{ p.favs }}</button>
      <sc-if value="{{ showShare }}"><button style="margin-left:auto;display:flex;align-items:center;height:32px;padding:0 8px;border:0;border-radius:16px;background:transparent;color:var(--text-2);font-size:18px;cursor:pointer" style-hover="background:var(--bg-sunk)">{{ I.share }}</button></sc-if>
    </div>
  </div>
</article>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:440,&quot;height&quot;:360},&quot;p&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;},&quot;variant&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;card&quot;,&quot;threads&quot;],&quot;default&quot;:&quot;card&quot;,&quot;tsType&quot;:&quot;'card'|'threads'&quot;},&quot;boxed&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;share&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;lang&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;zh&quot;,&quot;en&quot;],&quot;default&quot;:&quot;zh&quot;,&quot;tsType&quot;:&quot;'zh'|'en'&quot;}}">
class Component extends DCLogic {
  componentDidMount() {
    if (!window.ZXI2) this._t = setInterval(() => { if (window.ZXI2) { clearInterval(this._t); this.forceUpdate(); } }, 40);
  }
  componentWillUnmount() { clearInterval(this._t); }
  renderVals() {
    const I = window.ZXI2 ? window.ZXI2.make(React) : {};
    const p = this.props.p || {
      anon: true, initial: '风', name: '北门的风', time: '12 分钟前', ch: '求助问答', chN: 3, status: 'open', pinned: true,
      title: '示例：图书馆四楼的插座是不是又坏了？', body: '想问问有没有同学知道维修进度，期末周实在找不到位置。#求助 #图书馆', imgs: 1, likes: 12, comments: 4, favs: 3
    };
    const en = this.props.lang === 'en';
    const isThreads = (this.props.variant || 'card') === 'threads';
    const boxed = !!this.props.boxed;
    const L = (zh, e) => en ? e : zh;
    const badges = [];
    if (p.pinned) badges.push({ t: L('置顶', 'Pinned'), icon: I.pinF, fg: 'var(--accent-ink)', bg: 'var(--accent-soft)', bd: 'none' });
    if (p.anon) badges.push({ t: L('匿名', 'Anonymous'), fg: 'var(--seal)', bg: 'var(--seal-soft)', bd: 'inset 0 0 0 1px color-mix(in oklab,var(--seal) 45%,transparent)' });
    if (p.ch) badges.push({ t: p.ch, dot: 'var(--ch-' + (p.chN || 1) + ')', ring: '0 0 0 2px color-mix(in oklab,var(--ch-' + (p.chN || 1) + ') 22%,transparent)', fg: 'var(--text-2)', bg: 'var(--bg-sunk)', bd: 'none' });
    const st = { open: [L('进行中', 'Ongoing'), 'var(--info)', 'var(--info-soft)', I.clock], resolved: [L('已解决', 'Resolved'), 'var(--success)', 'var(--success-soft)', I.check], closed: [L('已结束', 'Closed'), 'var(--text-3)', 'var(--bg-sunk)', null] }[p.status];
    if (st) badges.push({ t: st[0], fg: st[1], bg: st[2], bd: 'none', icon: st[3] });
    if (p.priv) badges.push({ t: L('仅自己可见', 'Only me'), icon: I.lock, fg: 'var(--text-2)', bg: 'var(--bg-sunk)', bd: 'none' });
    if (p.review === 'pending') badges.push({ t: L('待审核', 'In review'), icon: I.clock, fg: 'var(--warning)', bg: 'var(--warning-soft)', bd: 'none' });
    if (p.review === 'rejected') badges.push({ t: L('未通过审核', 'Rejected'), icon: I.alert, fg: 'var(--danger)', bg: 'var(--danger-soft)', bd: 'none' });
    const segs = String(p.body || '').split(/(#[^\s#]+)/).filter(Boolean).map(t => ({ t, tag: t[0] === '#', plain: t[0] !== '#' }));
    const n = p.imgs || 0, shown = Math.min(n, 3);
    const imgs = Array.from({ length: shown }, (_, i) => ({ label: L('图片 ', 'IMG ') + (i + 1), more: i === 2 && n > 3 ? '+' + (n - 3) : '' }));
    const hue = 'var(--ch-' + (((String(p.name || '').charCodeAt(0) || 1) % 6) + 1) + ')';
    return {
      I, p, isThreads, real: !p.anon, time: en ? (p.timeEn || p.time) : p.time,
      followDot: isThreads && !p.anon && !p.own && !p.following,
      avBg: 'color-mix(in oklab,' + hue + ' 18%,var(--surface))', avFg: 'color-mix(in oklab,' + hue + ' 72%,var(--text))', avRing: 'inset 0 0 0 1px color-mix(in oklab,' + hue + ' 16%,transparent)',
      badges, hasBadges: badges.length > 0, segs, clamp: n ? 3 : 4,
      hasImgs: n > 0, imgs, imgCols: shown === 1 ? '1fr' : 'repeat(' + shown + ',1fr)', imgRatio: shown === 1 ? '16 / 9' : '1 / 1',
      likeIcon: p.liked ? I.heartF : I.heart, likeColor: p.liked ? 'var(--primary)' : 'var(--text-2)', likeBg: p.liked ? 'var(--primary-soft)' : 'transparent',
      favIcon: p.faved ? I.starF : I.star, favColor: p.faved ? 'var(--accent-ink)' : 'var(--text-2)', favBg: p.faved ? 'var(--accent-soft)' : 'transparent',
      showShare: !!this.props.share,
      bd: boxed ? '1px solid var(--line)' : '0', rd: boxed ? '18px' : '0', sh: boxed ? 'var(--shadow-1)' : 'none'
    };
  }
}
</script>
</body>
</html>
