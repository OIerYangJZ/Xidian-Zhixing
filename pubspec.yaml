name: xdu_treehole_web
description: See电 - 西电树洞移动端
publish_to: 'none'
version: 0.1.0+19

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  shared_preferences: ^2.3.2
  flutter_riverpod: ^2.6.1
  flutter_markdown: ^0.7.3+1
  flutter_math_fork: ^0.7.4

  # XDYou（Traintime PDA）整包嵌入，源码位于 packages/traintime_pda（见 scripts/setup_xdyou.sh）
  watermeter:
    path: packages/traintime_pda

  # Mobile端专用依赖
  go_router: ^14.0.0
  cached_network_image: ^3.3.1
  image_picker: ^1.0.7
  gal: ^2.3.0
  shimmer: ^3.0.0
  intl: ^0.20.2
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - packages/traintime_pda/assets/flutter_i18n/
    - packages/traintime_pda/assets/captcha-solver-payment.tflite
    - packages/traintime_pda/assets/captcha-solver-zfw.tflite
