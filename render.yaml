services:
  - type: web
    name: xdu-whisperbox
    runtime: python
    plan: free
    autoDeploy: true
    buildCommand: "python3 --version"
    startCommand: "BACKEND_HOST=0.0.0.0 BACKEND_PORT=$PORT python3 backend/server.py"
    envVars:
      - key: BACKEND_ENV
        value: production
      - key: BACKEND_ADMIN_USERNAME
        value: admin
      - key: BACKEND_ADMIN_PASSWORD
        sync: false
      - key: BACKEND_CORS_ALLOWED_ORIGINS
        sync: false
      - key: BACKEND_AUTH_ALLOWED_STUDENT_IDS
        sync: false
      - key: BACKEND_ENABLE_XIDIAN_AUTH
        value: "true"
      - key: BACKEND_XIDIAN_PUBLIC_ORIGIN
        value: https://zhixing.xidian.edu.cn
      - key: BACKEND_ALLOW_DEBUG_VERIFY_CODE
        value: "false"
      - key: BACKEND_INCLUDE_DEBUG_CODE
        value: "false"
      - key: BACKEND_SEED_DEMO_DATA
        value: "false"
      - key: BACKEND_AI_BASE_URL
        sync: false
      - key: BACKEND_AI_API_KEY
        sync: false
      - key: BACKEND_AI_MODEL
        value: gpt-4o-mini
      - key: BACKEND_AI_EMBEDDING_MODEL
        sync: false
