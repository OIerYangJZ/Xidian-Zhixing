services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./backend/data:/app/data
      - ./backend/storage/objects:/app/storage/objects
    environment:
      BACKEND_ENV: "development"
      BACKEND_HOST: "0.0.0.0"
      BACKEND_PORT: "8080"
      BACKEND_ADMIN_USERNAME: "${BACKEND_ADMIN_USERNAME:?Set BACKEND_ADMIN_USERNAME}"
      BACKEND_ADMIN_PASSWORD: "${BACKEND_ADMIN_PASSWORD:?Set BACKEND_ADMIN_PASSWORD}"
      BACKEND_DB_FILE: "/app/data/treehole.db"
      BACKEND_STORAGE_DIR: "/app/storage/objects"
      BACKEND_OBJECT_STORAGE_BACKEND: "${BACKEND_OBJECT_STORAGE_BACKEND:-local}"
      BACKEND_AUTH_ALLOWED_STUDENT_IDS: "${BACKEND_AUTH_ALLOWED_STUDENT_IDS:-}"
      BACKEND_ENABLE_XIDIAN_AUTH: "${BACKEND_ENABLE_XIDIAN_AUTH:-false}"
      BACKEND_XIDIAN_PUBLIC_ORIGIN: "${BACKEND_XIDIAN_PUBLIC_ORIGIN:-https://zhixing.xidian.edu.cn}"
      BACKEND_ALLOW_DEBUG_VERIFY_CODE: "${BACKEND_ALLOW_DEBUG_VERIFY_CODE:-false}"
      BACKEND_INCLUDE_DEBUG_CODE: "${BACKEND_INCLUDE_DEBUG_CODE:-false}"
      BACKEND_AI_BASE_URL: "${BACKEND_AI_BASE_URL:-}"
      BACKEND_AI_API_KEY: "${BACKEND_AI_API_KEY:-}"
      BACKEND_AI_MODEL: "${BACKEND_AI_MODEL:-gpt-4o-mini}"
      BACKEND_AI_EMBEDDING_MODEL: "${BACKEND_AI_EMBEDDING_MODEL:-}"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/channels', timeout=4).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
