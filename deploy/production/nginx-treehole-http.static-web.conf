# /etc/nginx/sites-enabled/treehole.conf — static web frontend edition.
#
# Replaces the HTTP-only file that is live today (it is NOT rendered from
# nginx-treehole-https.conf.template; the live file differs from the template).
# Differences from the live file:
#
#   * web/ now holds the Next.js static export (web_next/out).  Pages are
#     `feed.html`, `u/photos.html` …, so `/feed` resolves with $uri.html and
#     unknown paths get 404.html instead of an SPA fallback to index.html.
#   * Signed-in pages are gated on the server: auth_request asks the backend
#     (GET /api/auth/check, which reads the HttpOnly zx_session cookie the app
#     sets after login) and a 401 becomes a 302 to /login.  API calls are
#     unaffected; they still authenticate with the bearer token.
#   * The share links already handed out keep working: /p/<id> → /post?id=<id>,
#     /u/<id> → /u?id=<id>.
#   * The Flutter admin console moves under /admin/ (web/admin/, built with
#     --base-href /admin/), so the Flutter-specific cache rules move with it.
#   * /_next/static/ is content-hashed: cached for a year.
#   * POST /api/ai/chat gets a 180 s read timeout: the answer is one JSON body
#     after the model finishes, and 60 s already cuts long answers off today.
#
# Everything else — upstream, API proxying and timeouts, the knowledge-service
# timeouts, font/wasm MIME fixes, security headers — is carried over unchanged.
#
# Apply by hand in the audited session:
#   sudo cp treehole.conf /etc/nginx/sites-enabled/treehole.conf.bak-$(date +%Y%m%d%H%M%S)
#   sudo install -m 0644 nginx-treehole-http.static-web.conf /etc/nginx/sites-enabled/treehole.conf
#   sudo nginx -t && sudo systemctl reload nginx
# (auth_request needs ngx_http_auth_request_module; `nginx -V 2>&1 | grep -o
#  http_auth_request_module` must print it — Ubuntu's nginx-core includes it.)

upstream treehole_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name zhixing.xidian.edu.cn;
    server_tokens off;

    root /home/ubuntu/treehole/current/web;
    index index.html;
    client_max_body_size 20m;

    access_log /var/log/nginx/treehole.access.log;
    error_log  /var/log/nginx/treehole.error.log;

    # add_header does not inherit into a location that sets its own, so every
    # location below that adds a header repeats these three.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml application/wasm font/ttf font/otf;

    error_page 404 /404.html;

    # ------------------------------------------------------------ page gate

    # Subrequest target for auth_request.  204 = signed in, 401 = not.
    location = /_auth_check {
        internal;
        proxy_pass http://treehole_backend/api/auth/check;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
        proxy_connect_timeout 5s;
        proxy_read_timeout 5s;
    }

    # Not signed in: to the login page.  Nginx cannot URL-encode, so the page
    # travels as `next` with its own query parameters left beside it; the
    # login page puts them back together.
    location @login {
        return 302 /login?next=$uri&$args;
    }

    # ------------------------------------------------------------ old share links
    #
    # Regex locations match in file order, so these come before the page gate
    # below — otherwise its `u` alternative would claim /u/<id> and 404 it.

    location ~ ^/p/([^/]+)$ {
        return 302 /post?id=$1;
    }

    # /u/photos, /u/about … are real (gated) pages; anything else under /u/
    # is a profile link from before the static site.
    location ~ ^/u/([^/.]+)$ {
        auth_request /_auth_check;
        error_page 401 = @login;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri.html @profile_link;
    }

    location @profile_link {
        rewrite ^/u/([^/]+)$ /u?id=$1? redirect;
    }

    # Signed-in pages (the (protected) and (setup) route groups).  Their
    # .txt payloads for client-side navigation carry no user data and stay
    # ungated, so this matches the HTML only.
    location ~ ^/(feed|post|u|discover|tag|notifications|messages|settings|edit-profile|campus|ai)(/[^.]*)?$ {
        auth_request /_auth_check;
        error_page 401 = @login;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri.html $uri/index.html =404;
    }

    # ------------------------------------------------------------ static site

    location = /index.html {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # Content-hashed build output.
    location ^~ /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }

    # Public pages (/, /login, /terms …) and their .txt payloads.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri.html $uri/index.html =404;
    }

    # ------------------------------------------------------------ Flutter admin console

    location = /admin {
        return 301 /admin/;
    }

    # Not ^~: the font and wasm regex locations below must still win for the
    # console's own assets.
    location /admin/ {
        try_files $uri $uri/ /admin/index.html;
    }

    location ~* ^/admin/(?:index\.html|flutter_service_worker\.js)$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location ~* ^/admin/(?:main\.dart\.js|flutter(?:_bootstrap)?\.js|manifest\.json|version\.json|assets/(?:AssetManifest\.(?:bin|bin\.json|json)|FontManifest\.json))$ {
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    # Fonts are most of the web app's first frame (Flutter downloads every
    # manifest font before painting). mime.types has no ttf/otf entry, so they
    # went out as application/octet-stream and gzip_types never matched; the
    # scoped `types {}` gives them a real type that gzip does match.
    # Must stay above the generic static-asset regex below, which also
    # matches \.ttf$.  No add_header, for the same reason as \.wasm$ below.
    location ~* \.ttf$ {
        types { }
        default_type font/ttf;
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    location ~* \.otf$ {
        types { }
        default_type font/otf;
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    # nginx's packaged mime.types carries no wasm entry, so CanvasKit's .wasm
    # went out as application/octet-stream and the browser refused it:
    #   TypeError: Failed to execute 'compile' on 'WebAssembly':
    #   Incorrect response MIME type. Expected 'application/wasm'.
    # That rejection is an unhandled promise, so the app never painted its
    # first frame instead of reporting an error.
    #
    # The empty `types {}` scopes the override to this location.  A bare
    # `types { application/wasm wasm; }` at server level would REPLACE the
    # whole inherited map and serve js/css as octet-stream too.
    #
    # Must stay above the generic static-asset regex below: nginx takes the
    # first matching regex location, and that one also matches \.wasm$.
    #
    # No add_header here — nginx add_header does not inherit, so declaring one
    # would drop the server-level nosniff / X-Frame-Options / Referrer-Policy
    # from this response.  `expires` alone still emits Cache-Control.
    location ~* \.wasm$ {
        types { }
        default_type application/wasm;
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|wasm)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
        try_files $uri =404;
    }

    # ------------------------------------------------------------ API

    # Knowledge upserts and reindexing wait on the knowledge service for up to
    # 300 s / 600 s; the 60 s below would 504 them while the work carries on.
    location ^~ /api/admin/ai/ {
        proxy_pass http://treehole_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_connect_timeout 10s;
        proxy_send_timeout 620s;
        proxy_read_timeout 620s;
        proxy_request_buffering off;
    }

    # AI answers are one JSON body after the model finishes (the Flutter
    # client allows 165 s); 60 s would cut long answers off.
    location = /api/ai/chat {
        proxy_pass http://treehole_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_connect_timeout 10s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
        proxy_request_buffering off;
    }

    location /api/ {
        proxy_pass http://treehole_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_request_buffering off;
    }

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location ~ /\. {
        deny all;
    }
}
