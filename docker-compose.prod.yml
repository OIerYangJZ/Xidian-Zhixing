# Offline production compose file.
# Preload both linux/amd64 images with `docker load`; do not build on the server.
services:
  backend:
    image: "${TREEHOLE_BACKEND_IMAGE:?Set TREEHOLE_BACKEND_IMAGE to the preloaded linux/amd64 image tag}"
    restart: always
    env_file:
      - "${TREEHOLE_ENV_FILE:-/home/ubuntu/treehole/shared/config/backend.env}"
    environment:
      BACKEND_HOST: "0.0.0.0"
      BACKEND_PORT: "8080"
      BACKEND_DB_FILE: "/app/data/treehole.db"
      BACKEND_STORAGE_DIR: "/app/storage/objects"
      BACKEND_WEB_ROOT: "/app/web"
    volumes:
      - "${TREEHOLE_SHARED_DIR:-/home/ubuntu/treehole/shared}/data:/app/data"
      - "${TREEHOLE_SHARED_DIR:-/home/ubuntu/treehole/shared}/storage/objects:/app/storage/objects"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/channels', timeout=4).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  nginx:
    image: "${TREEHOLE_NGINX_IMAGE:-nginx:1.27-alpine}"
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - "${TREEHOLE_WEB_DIR:-/home/ubuntu/treehole/current/web}:/usr/share/nginx/html:ro"
      - "${TREEHOLE_NGINX_CONF:-/home/ubuntu/treehole/current/deploy/production/nginx-container.conf}:/etc/nginx/conf.d/default.conf:ro"
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=64m,mode=0755
      - /var/run:size=8m,mode=0755
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
